[project]
name = "raio-x-api"
version = "0.1.0"
description = "API e banco de dados do sistema operacional Raio X"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0", "psycopg[binary]>=3.2,<4.0", "alembic>=1.13,<2.0",
  "pydantic-settings>=2.5,<3.0", "PyJWT>=2.9,<3.0", "pwdlib[argon2]>=0.2,<1.0",
  "python-multipart>=0.0.12,<1.0", "openpyxl>=3.1,<4.0", "email-validator>=2.2,<3.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx2>=2.0,<3.0", "ruff>=0.9,<1.0"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F", "I"]
