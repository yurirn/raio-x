services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: raiox
      POSTGRES_USER: raiox
      POSTGRES_PASSWORD: raiox
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raiox -d raiox"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    volumes: ["./app:/app/app"]
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
